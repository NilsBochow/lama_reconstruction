# @package _group_
kwargs:
  accelerator: "gpu"
  devices: 1
  max_epochs: 70
  gradient_clip_val: 1
  #og_gpu_memory: None
  limit_train_batches: 25000 #370 for sic
  val_check_interval: 2300  # 200 for sic
  log_every_n_steps: 250 #50 for sic
  precision: 32
  #terminate_on_nan: False
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 8
  #replace_sampler_ddp: False
checkpoint_kwargs:
  verbose: True
  save_top_k: 20
  save_last: True
  every_n_epochs: 1
  monitor: val_ssim_fid100_f1_total_mean
  mode: max
